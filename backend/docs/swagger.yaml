basePath: /api/v1
host: localhost:8080
info:
  contact:
    email: support@labuda.com
    name: Labuda Support
    url: https://labuda.com/support
  description: Labuda Financial Core Backend API - Clean Architecture with DDD
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://labuda.com/terms
  title: Labuda Core Backend API
  version: "1.0"
paths: {}
securityDefinitions:
  BearerAuth:
    description: 'Firebase ID Token (Bearer token). Format: "Bearer <token>". Obtain
      token from Firebase Auth after user signs in. Token is validated on each request.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Health check endpoints
  name: health
- description: Payment processing with Midtrans
  name: payments
- description: Coin/Loyalty points management
  name: coins
- description: User management operations
  name: users
