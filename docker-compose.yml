version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: labuda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labuda
      POSTGRES_PASSWORD: labuda123
      POSTGRES_DB: labuda
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuda"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labuda-network

  redis:
    image: redis:7-alpine
    container_name: labuda-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labuda-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  labuda-network:
    driver: bridge
