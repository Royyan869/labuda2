version: "3.9"

# Compose project name: hishumi (product identity).
# Previously derived from directory name "labuda" — now pinned explicitly
# so the project name survives any directory rename.
name: hishumi

services:
  postgres:
    image: postgres:16-alpine
    container_name: hishumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hishumi
      POSTGRES_PASSWORD: hishumi_local_dev_pw
      POSTGRES_DB: hishumi
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hishumi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hishumi-network

  redis:
    image: redis:7-alpine
    container_name: hishumi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hishumi-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hishumi-network:
    driver: bridge
