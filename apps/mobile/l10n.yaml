# Localization configuration for gen-l10n (flutter gen-l10n)
#
# SINGLE SOURCE OF TRUTH:
# - ARB source files live in:   lib/l10n/            (app_en.arb, app_id.arb)
# - Generated Dart files go to: lib/generated/       (imported by the app)
#
# The app imports from `package:labuda/generated/app_localizations.dart`.
# Keep output-dir aligned with that import path so there is exactly one set
# of generated files (no duplicates / dead code).

arb-dir: lib/l10n
output-dir: lib/generated
template-arb-file: app_en.arb
output-class: AppLocalizations
output-localization-file: app_localizations.dart
